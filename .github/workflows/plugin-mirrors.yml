name: Plugin mirrors

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify-mirrors:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v6
      - name: Check out PhotoVault theme
        uses: actions/checkout@v6
        with:
          repository: enockmigjr/PhotoVault
          path: wp-content/themes/PhotoVault
      - name: Check out Identity Security Kit
        uses: actions/checkout@v6
        with:
          repository: enockmigjr/identity-security-kit
          path: wp-content/plugins/identity-security-kit
      - name: Check out Newsletter Campaign Kit
        uses: actions/checkout@v6
        with:
          repository: enockmigjr/newsletter-campaign-kit
          path: wp-content/plugins/newsletter-campaign-kit
      - name: Check out PhotoVault Core
        uses: actions/checkout@v6
        with:
          repository: enockmigjr/photovault-core
          path: wp-content/plugins/photovault-core
      - name: Install Trouble Ticket Connector distribution mirror
        shell: bash
        run: |
          test -f wp-content/themes/PhotoVault/plugins/trouble-ticket-connector/trouble-ticket-connector.php
          cp -a wp-content/themes/PhotoVault/plugins/trouble-ticket-connector wp-content/plugins/trouble-ticket-connector
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - name: Validate Trouble Ticket Connector
        shell: bash
        run: |
          find wp-content/plugins/trouble-ticket-connector -name '*.php' -print0 | xargs -0 -n1 php -l
          php wp-content/plugins/trouble-ticket-connector/tests/assertion-service.php
      - run: php scripts/check-plugin-mirrors.php
